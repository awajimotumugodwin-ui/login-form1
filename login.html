<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login Form</title>
    <link rel="stylesheet" href="styles/login.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>

<body>
    <div class="wrapper">
        <form action="login.html" method="get">
            <h1>Login Form</h1>
            <div class="input-box">
                <input type="text" name="username" placeholder="Username" pattern="[a-zA-Z0-9_]{3,20}" autocomplete="username" required>
                <i class="field-icon bx bxs-user"></i>
            </div>
            <div class="input-box">
                <input class="password-toggle" type="checkbox" id="show-login-password">
                <input class="password-input" type="text" name="password" placeholder="Password" minlength="8" autocomplete="current-password" required>
                <label class="field-icon password-icon" for="show-login-password" aria-label="Show password">
                    <i class="bx bx-hide"></i>
                </label>
            </div>
            <div class="remember-forgot">
                <label>
                    <input type="checkbox">Remember Me
                </label>
                <a href="forgotpassword.html">Forgotten Password?</a>
            </div>
            <button type="submit" class="btn">Login</button>
            <div class="register-link">
                <p>Don't have an account? <a href="index.html">Register</a></p>
            </div>
        </form>
    </div>
</body>

</html>
