<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Forgot Password</title>
    <link rel="stylesheet" href="styles/signup.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>

<body>
    <div class="wrapper">
        <form action="login.html" method="get">
            <h1>Forgot Password</h1>
            <p class="subtitle">Enter your email or username and we'll send you a link to reset your password.</p>

            <div class="input-box">
                <input type="text" id="identifier" name="identifier" placeholder="Email or Username"
                    autocomplete="username" required>
                <i class="field-icon bx bxs-envelope"></i>
            </div>

            <button type="submit" class="btn">Send Reset Link</button>

            <div class="back-link">
                <p><a href="./login.html"> Back to Login</a></p>
            </div>
        </form>
    </div>
</body>

</html>
